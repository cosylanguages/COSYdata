<!DOCTYPE html>
<html lang="{{code}}">
<head>
  <!-- Generated by scripts/build-pages.cjs from templates/dictionary-page.html. Edit the template, not this file. -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <link rel="canonical" href="{{url}}" />

  <!-- Open Graph -->
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:url" content="{{url}}" />
  <meta property="og:type" content="website" />
  <meta property="og:locale" content="{{locale}}" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="{{title}}" />
  <meta name="twitter:description" content="{{description}}" />

  <script src="../../shared/cosy-theme.js"></script>
  <link rel="stylesheet" href="../../shared/vendor/css/fonts.css" />
  <link rel="stylesheet" href="../../shared/vendor/tokens.css" />
  <link rel="stylesheet" href="../../shared/dictionary-ui.css" />
  <link rel="stylesheet" href="../../shared/vendor/css/ecosystem-strip.css">
</head>
<body>
  <button type="button" class="cosy-theme-fab" data-cosy-theme-toggle aria-label="Switch theme">🌙</button>
  <div id="dictionary-app" data-dictionary-lang="{{code}}" data-base-url="../../">
    <h1 class="cosy-dict-title">{{heading}}</h1>
  </div>
  <script type="module">
    import { initDictionaryUI } from '../../shared/dictionary-ui.js';
    initDictionaryUI('#dictionary-app', { lang: '{{code}}', baseUrl: '../../' });
  </script>
  <script src="../../shared/vendor/js/ecosystem-strip.js" defer></script>
</body>
</html>
