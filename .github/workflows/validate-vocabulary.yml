name: Validate Vocabulary

on:
  push:
    branches: [ main ]
    paths:
      - 'vocabulary/**'
      - 'functional-phrases/**'
      - 'curriculum/**'
      - 'taxonomy/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'shared/**'
      - 'templates/**'
      - 'tests/**'
      - 'reports/quality-baseline.json'
      - '*.html'
      - 'stats.json'
  pull_request:
    branches: [ main ]
    paths:
      - 'vocabulary/**'
      - 'functional-phrases/**'
      - 'curriculum/**'
      - 'taxonomy/**'
      - 'schemas/**'
      - 'scripts/**'
      - 'shared/**'
      - 'templates/**'
      - 'tests/**'
      - 'reports/quality-baseline.json'
      - '*.html'
      - 'stats.json'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Validate vocabulary, themes and quality baseline
        run: npm run validate

      - name: Validate Taxonomy
        run: node scripts/validate-taxonomy.cjs

      - name: Validate Verb Inventory
        run: npm run test:verb-inventory

      - name: Audit A0/A1 Data
        run: npm run audit

      - name: Build A0/A1 Parity Report
        run: npm run parity

      - name: Test Quality Rules
        run: npm run test:quality

      - name: Test Parity Loader
        run: npm run test:parity

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Test Conjugation Embed
        run: npm run test:conjugation

      - name: Test Repository Independence
        run: npm run test:independence

      - name: Test Statistics Artifact
        run: npm run test:stats

      - name: Test Generated Pages
        run: npm run test:pages

      - name: Check Index Freshness
        run: |
          npm run build:index
          if ! git diff --exit-code vocabulary/; then
            echo "Error: vocabulary index.json files are out of date! Please run 'npm run build:index' and commit the changes."
            exit 1
          fi

      - name: Check Flat Index Freshness
        run: |
          npm run build:flat-index
          if ! git diff --exit-code vocabulary/; then
            echo "Error: vocabulary flat-index.json files are out of date! Please run 'npm run build:flat-index' and commit the changes."
            exit 1
          fi

      - name: Check Stats Freshness
        run: npm run check:stats

      - name: Check Search Index Freshness
        run: |
          npm run build:search-index
          if ! git diff --exit-code vocabulary/; then
            echo "Error: vocabulary search-index.json files are out of date! Please run 'npm run build:search-index' and commit the changes."
            exit 1
          fi
