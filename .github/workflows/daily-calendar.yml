name: Rebuild Daily Calendars

on:
  schedule:
    # Run every day at 03:30 UTC, before the COSYevents spotlights job at 04:00.
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-daily-calendars:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '20'

      - name: Rebuild the daily calendars
        run: node scripts/build-daily-calendar.cjs

      - name: Commit and push if updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add daily
          if git diff --staged --quiet; then
            echo "Daily calendars already cover the horizon."
          else
            git commit -m "chore(daily): rebuild daily calendars for $(date -u +'%Y-%m')"
            git push
          fi
