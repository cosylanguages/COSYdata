name: Notify Consumer Repositories

on:
  push:
    branches: [ main ]
    paths:
      - 'vocabulary/**'
      - 'functional-phrases/**'
      - 'curriculum/**'

jobs:
  notify-consumers:
    runs-on: ubuntu-latest
    steps:
      - name: Dispatch repository_dispatch event to consumer repos
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
        run: |
          set -euo pipefail
          REPOS=("COSYlanguages/COSYlanguages" "COSYlanguages/COSYmanuals" "COSYlanguages/COSYtools" "COSYlanguages/COSYgames" "COSYlanguages/COSYplatform")
          for REPO in "${REPOS[@]}"; do
            echo "Notifying $REPO..."
            curl --fail-with-body --silent --show-error -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_PAT" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              https://api.github.com/repos/$REPO/dispatches \
              -d '{"event_type":"vocabulary_updated"}'
          done
