<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Core Verbs Conjugation Engine — COSYdata</title>
  <meta name="description" content="Interactive present simple conjugation tables for 40 core verbs across 14 languages (Part 1, Part 2, Part 3)." />
  <link rel="canonical" href="https://cosylanguages.github.io/COSYdata/top10-verbs.html" />

  <script src="./shared/cosy-theme.js"></script>
  <link rel="stylesheet" href="./shared/vendor/css/fonts.css" />
  <link rel="stylesheet" href="./shared/vendor/tokens.css" />
  <link rel="stylesheet" href="./shared/dictionary-ui.css" />
  <link rel="stylesheet" href="./shared/top10-verbs.css" />
  <link rel="stylesheet" href="./shared/vendor/css/ecosystem-strip.css">
</head>
<body>
  <button type="button" class="cosy-theme-fab" data-cosy-theme-toggle aria-label="Switch theme">🌙</button>
  <!-- Top Ecosystem Strip Nav -->
  <div data-ecosystem-strip data-self="data"></div>

  <header class="hero">
    <span class="hero-badge">COSYmagazine Series</span>
    <h1 class="hero-title">Core Verbs Conjugation Engine</h1>
    <p class="hero-subtitle">
      Present simple conjugation tables for 40 core verbs across 14 languages (Part 1, Part 2 &amp; Part 3).
    </p>
    <div class="hero-pills">
      <a href="./index.html" class="pill-btn">← Back to COSYdata Hub</a>
      <a href="https://cosylanguages.github.io/COSYlanguages/" target="_blank" class="pill-btn">COSYlanguages Main Site 🌐</a>
    </div>
  </header>

  <main class="container">
    <section class="filter-card">
      <div class="filter-group">
        <span class="filter-label">Article Part:</span>
        <button class="btn-toggle active" onclick="setPart(0)" id="part-btn-0">All Parts (40 Verbs)</button>
        <button class="btn-toggle" onclick="setPart(1)" id="part-btn-1">Part 1 (Core Daily)</button>
        <button class="btn-toggle" onclick="setPart(2)" id="part-btn-2">Part 2 (Actions &amp; Comm.)</button>
        <button class="btn-toggle" onclick="setPart(3)" id="part-btn-3">Part 3 (Mind &amp; Exchange)</button>
      </div>

      <div class="filter-group">
        <span class="filter-label">Target Language:</span>
        <select id="lang-select" onchange="renderVerbs()">
          <option value="en">🇬🇧 English (en)</option>
          <option value="fr" selected>🇫🇷 Français (fr)</option>
          <option value="it">🇮🇹 Italiano (it)</option>
          <option value="de">🇩🇪 Deutsch (de)</option>
          <option value="ru">🇷🇺 Русский (ru)</option>
          <option value="el">🇬🇷 Ελληνικά (el)</option>
          <option value="es">🇪🇸 Español (es)</option>
          <option value="pt">🇵🇹 Português (pt)</option>
          <option value="hy">🇦🇲 Հայերեն (hy)</option>
          <option value="ka">🇬🇪 ქართული (ka)</option>
          <option value="ba">🌐 Башҡортса (ba)</option>
          <option value="br">🏴 Brezhoneg (br)</option>
          <option value="cv">🌐 Чӑвашла (cv)</option>
          <option value="tt">🌐 Татарча (tt)</option>
        </select>

        <input type="text" id="search-input" placeholder="Search verbs..." oninput="renderVerbs()" />
      </div>
    </section>

    <div class="verbs-grid" id="verbs-grid">
      <!-- Dynamically generated verb cards -->
    </div>
  </main>

  <footer class="footer">
    <p>Copyright (c) 2020–2026 COSY Languages. All rights reserved.</p>
  </footer>

  <script>
    let verbsData = [];
    let currentPart = 0;

    const flags = {
      en: '🇬🇧', fr: '🇫🇷', it: '🇮🇹', de: '🇩🇪', ru: '🇷🇺', el: '🇬🇷', es: '🇪🇸', pt: '🇵🇹',
      hy: '🇦🇲', ka: '🇬🇪', ba: '🌐', br: '🏴', cv: '🌐', tt: '🌐'
    };

    async function init() {
      try {
        const res = await fetch('./shared/top10-verbs.json');
        verbsData = await res.json();
        renderVerbs();
      } catch (err) {
        document.getElementById('verbs-grid').innerHTML = '<p style="color: red;">Error loading verb conjugations data.</p>';
      }
    }

    function escapeHtml(value) {
      return String(value ?? '').replace(/[&<>"']/g, (ch) => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      })[ch]);
    }

    function setPart(part) {
      currentPart = part;
      for (let i = 0; i <= 3; i++) {
        const btn = document.getElementById(`part-btn-${i}`);
        if (btn) btn.classList.toggle('active', i === part);
      }
      renderVerbs();
    }

    function renderVerbs() {
      const grid = document.getElementById('verbs-grid');
      const lang = document.getElementById('lang-select').value;
      const search = document.getElementById('search-input').value.toLowerCase().trim();

      const filtered = verbsData.filter(v => {
        if (currentPart !== 0 && v.part !== currentPart) return false;
        if (search) {
          const matchTitle = v.english_title.toLowerCase().includes(search);
          const langData = v.languages[lang];
          const matchInf = langData && langData.infinitive.toLowerCase().includes(search);
          return matchTitle || matchInf;
        }
        return true;
      });

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; padding: 40px; color: var(--cosy-muted);">No verbs found matching your filters.</div>`;
        return;
      }

      grid.innerHTML = filtered.map(v => {
        const langInfo = v.languages[lang] || { infinitive: 'N/A', notes: 'No notes', conjugation: {} };
        const flag = flags[lang] || '🌐';

        const conjRows = Object.entries(langInfo.conjugation || {}).map(([pronoun, form]) => `
          <tr>
            <td class="pronoun-col">${escapeHtml(pronoun)}</td>
            <td class="verb-col">${escapeHtml(form)}</td>
          </tr>
        `).join('');

        return `
          <div class="verb-card">
            <div>
              <div class="verb-header">
                <h3 class="verb-title"><span>${escapeHtml(v.emoji)}</span> ${escapeHtml(v.english_title)}</h3>
                <span class="part-badge">Part ${escapeHtml(v.part)}</span>
              </div>
              <div class="verb-infinitive">${escapeHtml(flag)} ${escapeHtml(langInfo.infinitive)}</div>
              <div class="verb-notes">${escapeHtml(langInfo.notes || 'Standard present simple conjugation.')}</div>
            </div>
            <table class="conjugation-table">
              <thead>
                <tr>
                  <th>Pronoun</th>
                  <th>Present Form</th>
                </tr>
              </thead>
              <tbody>
                ${conjRows}
              </tbody>
            </table>
          </div>
        `;
      }).join('');
    }

    init();
  </script>
  <script src="./shared/vendor/js/ecosystem-strip.js" defer></script>
</body>
</html>
